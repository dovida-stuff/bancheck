name: Update Banning Register CSVs

on:
  schedule:
    # GitHub runs scheduled workflows on a best-effort basis: the 01:00 UTC
    # slot has historically started anywhere from 02:00 to 12:00 UTC. Two
    # slots a day keep the data fresh even when one is delayed or dropped.
    - cron: '0 1 * * *'    # 11am AEST
    - cron: '0 20 * * *'   # 6am AEST
  workflow_dispatch:

# A manual run started while a scheduled run is still going would race it to
# push; queue it instead.
concurrency:
  group: update-registers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-registers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check ScrapingBee fallback key
        env:
          KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::SCRAPINGBEE_API_KEY not set. Direct fetch will be attempted; ScrapingBee fallback disabled."
          fi

      # Both fetches run scripts/fetch-register.sh: a direct download, then a
      # ScrapingBee fallback, and a download only replaces the published CSV
      # after passing validation (see the script header). A failed fetch keeps
      # the last good file and is reported by the final step.

      - name: Fetch ACQSC Aged Care register
        id: acqsc
        continue-on-error: true
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          REGISTER: acqsc
          URL: https://www.agedcarequality.gov.au/sites/default/files/media/register-banning-orders-data-file.csv
          REFERER: https://www.agedcarequality.gov.au/providers/non-compliance/banning-orders
          TARGET: aged-care-register.csv
        run: scripts/fetch-register.sh

      - name: Fetch NDIS Commission register
        id: ndis
        continue-on-error: true
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          REGISTER: ndis
          URL: https://www.ndiscommission.gov.au/about-us/compliance-and-enforcement/compliance-actions/search/download-csv
          REFERER: https://www.ndiscommission.gov.au/about-us/compliance-and-enforcement/compliance-actions/search
          TARGET: ndis-register.csv
        run: scripts/fetch-register.sh

      # register-meta.json is what the page reads to show when each register
      # last changed / was last checked, its row count and its SHA-256 hash.
      # It is regenerated on every run, so a run that finds no new data still
      # leaves a visible "checked on <date>" record.
      - name: Record register metadata
        id: meta
        continue-on-error: true
        run: node scripts/register-meta.mjs --acqsc=${{ steps.acqsc.outcome }} --ndis=${{ steps.ndis.outcome }}

      # Runs the matcher against the freshly downloaded files. A failure here
      # means a name format in the new data is not handled — the data is still
      # published (a stale register is the bigger risk), but the workflow is
      # marked failed so the problem is noticed.
      - name: Test matcher against the new data
        id: test
        continue-on-error: true
        run: node test/match.test.mjs

      # A metadata failure means a CSV is structurally unusable (missing
      # column, broken quoting) — publishing it would make the checker report
      # "Not Banned" for everyone. Keep the last good CSVs in that case and
      # record the run as a failed fetch so the page shows the amber warning.
      - name: Commit updated CSVs
        env:
          META_OK: ${{ steps.meta.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$META_OK" != "true" ]; then
            echo "::warning::Metadata/column check failed — keeping the previously published CSVs"
            git checkout -- aged-care-register.csv ndis-register.csv
            node scripts/register-meta.mjs --acqsc=failure --ndis=failure || true
          fi
          git add aged-care-register.csv ndis-register.csv register-meta.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          if git diff --staged --quiet -- aged-care-register.csv ndis-register.csv; then
            git commit -m "Auto-update: registers checked $(date -u +'%Y-%m-%d'), no changes"
          else
            git commit -m "Auto-update: register CSVs $(date -u +'%Y-%m-%d')"
          fi
          # Retry if main moved during the run; our register files are newer
          # by construction, so they win any conflict on those paths.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $i) — rebasing onto the current main"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1

      - name: Fail if any step failed
        if: always() && (steps.acqsc.outcome != 'success' || steps.ndis.outcome != 'success' || steps.meta.outcome != 'success' || steps.test.outcome != 'success')
        run: |
          echo "::error::ACQSC fetch: ${{ steps.acqsc.outcome }} | NDIS fetch: ${{ steps.ndis.outcome }} | metadata: ${{ steps.meta.outcome }} | matcher tests: ${{ steps.test.outcome }}"
          echo "::error::One or more steps failed. Check the steps above. The last good register files remain published."
          exit 1
